# TEMPLATE: place in the protected product's repo, alongside a vendored Siftkeep
# checkout at tools/siftkeep. Configure repository variables/secrets below.
name: Siftkeep fingerprint watch
on:
  workflow_dispatch:
  # Optional: uncomment after configuring credentials and the alert receiver.
  # schedule:
  #   - cron: '17 */12 * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: tools/siftkeep
      - run: npm run siftkeep -- scan-github --project "$SIFTKEEP_PROJECT" --owned-repo "$OWNED_REPO"
        working-directory: tools/siftkeep
        env:
          SIFTKEEP_PROJECT: ${{ vars.SIFTKEEP_PROJECT }}
          OWNED_REPO: ${{ github.repository }}
          SIFTKEEP_SECRET: ${{ secrets.SIFTKEEP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.SIFTKEEP_SEARCH_TOKEN }}
          SIFTKEEP_WEBHOOK_URL: ${{ secrets.SIFTKEEP_WEBHOOK_URL }}
          SIFTKEEP_WEBHOOK_SECRET: ${{ secrets.SIFTKEEP_WEBHOOK_SECRET }}
